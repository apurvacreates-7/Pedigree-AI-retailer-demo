          <div class=\"pct-row\">\n              <span>Rendering<\u002Fspan>\n              <span class=\"pct\" id=\"loader-pct\">0%<\u002Fspan>\n            <\u002Fdiv>\n            <div class=\"track\"><div class=\"fill\" id=\"loader-fill\"><\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"err\" id=\"loader-err\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ============ SCREEN 7: VIDEO ============ -->\n    <section class=\"screen\" id=\"screen-video\" data-screen-label=\"07 Video\">\n      <div class=\"video-head\">\n        <div class=\"brand-mini\">PEDIGREE<span class=\"dot\"><\u002Fspan><\u002Fdiv>\n        <div class=\"step\" style=\"color: var(--yellow);\">READY<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"video-wrap\">\n        <video id=\"result-video\" controls=\"\" playsinline=\"\" preload=\"auto\"><\u002Fvideo>\n      <\u002Fdiv>\n      <div class=\"summary\">\n        <div class=\"summary-title\">Your Pedigree Retailer Video<\u002Fdiv>\n        <div class=\"summary-grid\">\n          <div class=\"item\">\n            <div class=\"k\">Owner<\u002Fdiv>\n            <div class=\"v\" id=\"sum-name\">—<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"item\">\n            <div class=\"k\">Store<\u002Fdiv>\n            <div class=\"v\" id=\"sum-store\">—<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"item full\">\n            <div class=\"k\">Area<\u002Fdiv>\n            <div class=\"v\" id=\"sum-area\">—<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"item full\">\n            <div class=\"k\">Products<\u002Fdiv>\n            <div class=\"v\" id=\"sum-products\">—<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"actions\">\n        <button class=\"btn btn-primary\" id=\"btn-download\">\n          <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4\"><\u002Fpath><polyline points=\"7 10 12 15 17 10\"><\u002Fpolyline><line x1=\"12\" y1=\"15\" x2=\"12\" y2=\"3\"><\u002Fline><\u002Fsvg>\n          Download Video\n        <\u002Fbutton>\n        <button class=\"btn btn-ghost\" id=\"btn-restart\">Create Another<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n  <\u002Fdiv>\n\n<script>\n  // =================================================================\n  // HeyGen API key\n  // =================================================================\n  const HEYGEN_API_KEY = 'sk_V2_hgu_kT9Jt3lY3Wh_KZcuQh3pY0IOZMheINhQJVrYaLfDMMQv';\n  // Pool of avatars — one is picked at random per video so the same retailer\n  // sees variety across generations.\n  const AVATAR_POOL = [\n    '61bf6b30cfd14c14855141a318f9feb3',\n    '53f5ee0df0fd48119b307af7785ffabc',\n    'a2d49d86a6aa40c1995640518b72b73b',\n  ];\n  const VOICE_ID = '1b4b765894804e97afe4541ade7f99d3';\n  const pickAvatar = () => AVATAR_POOL[Math.floor(Math.random() * AVATAR_POOL.length)];\n\n  // ====== State ======\n  const state = {\n    firstName: '',\n    lastName: '',\n    storeName: '',\n    area: '',\n    product: null,        // 'dry' | 'wet' | 'dentastix' | 'all'\n    productLabel: '',\n    productText: '',\n    videoUrl: '',\n  };\n\n  const PRODUCT_MAP = {\n    dry:       { label: 'Pedigree Dry Food',            text: 'Pedigree Dry Food for adult and puppy dogs' },\n    wet:       { label: 'Pedigree Wet Food (Pouches)',  text: 'Pedigree Wet Food Pouches in delicious flavours' },\n    dentastix: { label: 'Pedigree Dentastix',           text: \"Pedigree Dentastix for your dog's dental health\" },\n    all:       { label: 'All Pedigree Products',        text: 'the full range of Pedigree products including Dry Food, Wet Food Pouches, and Dentastix' },\n  };\n\n  // ====== Navigation ======\n  const screens = ['welcome', 'name', 'store', 'area', 'products', 'loading', 'video'];\n  let currentScreen = 'welcome';\n\n  function go(name) {\n    const cur = document.getElementById('screen-' + currentScreen);\n    const next = document.getElementById('screen-' + name);\n    if (!next) return;\n    if (cur) cur.classList.remove('active');\n    next.classList.add('active');\n    currentScreen = name;\n    // focus first input on the new screen\n    setTimeout(() => {\n      const input = next.querySelector('input');\n      if (input && name !== 'welcome' && name !== 'loading' && name !== 'video') input.focus();\n    }, 420);\n  }\n\n  // Click handlers for [data-go] and [data-back]\n  document.addEventListener('click', (e) => {\n    const goEl = e.target.closest('[data-go]');\n    if (goEl) {\n      go(goEl.getAttribute('data-go'));\n      return;\n    }\n    const backEl = e.target.closest('[data-back]');\n    if (backEl) {\n      go(backEl.getAttribute('data-back'));\n      return;\n    }\n  });\n\n  // ====== Field validation ======\n  const firstNameEl = document.getElementById('firstName');\n  const lastNameEl  = document.getElementById('lastName');\n  const storeEl     = document.getElementById('storeName');\n  const areaEl      = document.getElementById('area');\n\n  const btnNameNext     = document.getElementById('btn-name-next');\n  const btnStoreNext    = document.getElementById('btn-store-next');\n  const btnAreaNext     = document.getElementById('btn-area-next');\n  const btnProductsNext = document.getElementById('btn-products-next');\n\n  function refreshName() {\n    state.firstName = firstNameEl.value.trim();\n    state.lastName  = lastNameEl.value.trim();\n    btnNameNext.disabled = !(state.firstName && state.lastName);\n  }\n  function refreshStore() {\n    state.storeName = storeEl.value.trim();\n    btnStoreNext.disabled = !state.storeName;\n  }\n  function refreshArea() {\n    state.area = areaEl.value.trim();\n    btnAreaNext.disabled = !state.area;\n  }\n\n  [firstNameEl, lastNameEl].forEach(el => el.addEventListener('input', refreshName));\n  storeEl.addEventListener('input', refreshStore);\n  areaEl.addEventListener('input',  refreshArea);\n\n  // Enter-to-continue convenience\n  function bindEnter(el, btn) {\n    el.addEventListener('keydown', (e) => {\n      if (e.key === 'Enter' && !btn.disabled) {\n        e.preventDefault();\n        btn.click();\n      }\n    });\n  }\n  bindEnter(firstNameEl, btnNameNext);\n  bindEnter(lastNameEl,  btnNameNext);\n  bindEnter(storeEl,     btnStoreNext);\n  bindEnter(areaEl,      btnAreaNext);\n\n  // ====== Product selection ======\n  const productCards = document.querySelectorAll('#product-cards .card');\n  productCards.forEach(card => {\n    card.addEventListener('click', () => {\n      productCards.forEach(c => c.classList.remove('selected'));\n      card.classList.add('selected');\n      state.product = card.getAttribute('data-product');\n      const map = PRODUCT_MAP[state.product];\n      state.productLabel = map.label;\n      state.productText  = map.text;\n      btnProductsNext.disabled = false;\n    });\n  });\n\n  // ====== Generate flow ======\n  btnProductsNext.addEventListener('click', () => {\n    if (btnProductsNext.disabled) return;\n    fillSummary();\n    go('loading');\n    startGeneration().catch(err => showLoadError(err && err.message ? err.message : String(err)));\n  });\n\n  function fillSummary() {\n    document.getElementById('sum-name').textContent     = `${state.firstName} ${state.lastName}`;\n    document.getElementById('sum-store').textContent    = state.storeName;\n    document.getElementById('sum-area').textContent     = state.area;\n    document.getElementById('sum-products').textContent = state.productLabel;\n  }\n\n  // Cycle the small status copy under the loader\n  const LOAD_MESSAGES = [\n    'Warming up the studio',\n    'Briefing your avatar',\n    'Writing your script',\n    `Greeting ${state.firstName || 'you'} ji`,\n    'Rendering frames',\n    'Polishing the final cut',\n    'Almost there',\n  ];\n  let loadTimer = null;\n  function startLoadCopy() {\n    const el = document.getElementById('loader-sub');\n    let i = 0;\n    LOAD_MESSAGES[3] = `Greeting ${state.firstName} ji`;\n    el.textContent = LOAD_MESSAGES[0];\n    loadTimer = setInterval(() => {\n      i = (i + 1) % LOAD_MESSAGES.length;\n      el.style.opacity = '0';\n      setTimeout(() => {\n        el.textContent = LOAD_MESSAGES[i];\n        el.style.opacity = '';\n      }, 220);\n    }, 3200);\n  }\n  function stopLoadCopy() {\n    if (loadTimer) { clearInterval(loadTimer); loadTimer = null; }\n  }\n\n  // ====== Progress bar ======\n  // HeyGen's status endpoint may include a numeric progress field. If present\n  // we trust it; otherwise we run a smooth synthetic crawl that asymptotes\n  // toward 92% so it never looks stuck, and snaps to 100% on completion.\n  let progress = 0;            // 0..100 actually rendered to the bar\n  let progressTarget = 0;       // what we're easing toward\n  let progressTicker = null;\n  let progressStartTs = 0;\n\n  function setProgressTarget(pct) {\n    progressTarget = Math.max(0, Math.min(100, pct));\n  }\n  function renderProgress() {\n    // Ease current toward target\n    const delta = progressTarget - progress;\n    progress += delta * 0.18;\n    if (Math.abs(delta) < 0.05) progress = progressTarget;\n    const fill = document.getElementById('loader-fill');\n    const pct  = document.getElementById('loader-pct');\n    if (fill) fill.style.width = progress.toFixed(1) + '%';\n    if (pct)  pct.textContent  = Math.round(progress) + '%';\n  }\n  function startProgress() {\n    progress = 0;\n    progressTarget = 0;\n    progressStartTs = performance.now();\n    // tick at ~60fps for smooth easing\n    progressTicker = setInterval(() => {\n      // synthetic curve when we have no server-reported %\n      // approaches 92% over ~90s, never quite getting there\n      const elapsed = (performance.now() - progressStartTs) / 1000; // seconds\n      const synthetic = 92 * (1 - Math.exp(-elapsed / 30));\n      if (synthetic > progressTarget) setProgressTarget(synthetic);\n      renderProgress();\n    }, 60);\n  }\n  function stopProgress(complete) {\n    if (complete) {\n      setProgressTarget(100);\n      // let it animate to 100 then halt\n      setTimeout(() => {\n        if (progressTicker) { clearInterval(progressTicker); progressTicker = null; }\n      }, 700);\n    } else if (progressTicker) {\n      clearInterval(progressTicker); progressTicker = null;\n    }\n  }\n  function showLoadError(msg) {\n    stopLoadCopy();\n    stopProgress(false);\n    const err = document.getElementById('loader-err');\n    err.textContent = 'We hit a snag generating your video: ' + msg + '. Please try again.';\n    err.classList.add('show');\n  }\n\n  // =================================================================\n  // Regional script builder\n  // North India / default → Hinglish (with respectful \"ji\")\n  // Tamil Nadu → Tanglish (Tamil + English)\n  // Karnataka → Kanglish (Kannada + English)\n  // Kerala → Manglish (Malayalam + English)\n  // Andhra Pradesh / Telangana → Tenglish (Telugu + English)\n  // The scripts are written in spoken, easygoing style — the way a real\n  // person would chat at the shop, not formal/written prose.\n  // =================================================================\n  function detectRegion(area) {\n    const a = (area || '').toLowerCase();\n    if (/tamil\\s*nadu|\\btn\\b|chennai|madras|coimbatore|madurai|tiruchirappalli|trichy|salem|tirunelveli|erode|vellore|thanjavur|tirupur|tuticorin|thoothukudi|kanchipuram|pondicherry|puducherry/.test(a)) return 'tamil';\n    if (/karnataka|bengaluru|bangalore|mysuru|mysore|hubli|hubballi|mangalore|mangaluru|belgaum|belagavi|gulbarga|kalaburagi|udupi|davangere|shimoga|shivamogga|tumkur|tumakuru/.test(a)) return 'kannada';\n    if (/kerala|kochi|cochin|thiruvananthapuram|trivandrum|kozhikode|calicut|ernakulam|thrissur|trissur|palakkad|kannur|kollam|alappuzha|alleppey|malappuram|kottayam/.test(a)) return 'malayalam';\n    if (/telangana|andhra|hyderabad|secunderabad|vijayawada|visakhapatnam|vizag|tirupati|guntur|nellore|warangal|kurnool|rajahmundry|kakinada|\\bap\\b|\\bts\\b/.test(a)) return 'telugu';\n    return 'hinglish';\n  }\n\n  function buildScript({ firstName, lastName, storeName, area, productText }) {\n    const full = `${firstName} ${lastName}`;\n    const region = detectRegion(area);\n\n    switch (region) {\n      case 'tamil':\n        return `Vanakkam ${full} sir! ${area}-la irukkura dog parents, unga furry friend-oda nalvalvuku ${storeName}-ku vaanga. Inga kidaikkum ${productText} — complete and balanced nutrition. Pedigree-oda, unga dog-ku oru healthy and happy life kudunga. We're for Dogs!`;\n\n      case 'kannada':\n        return `Namaskara ${full} avare! ${area}-li iruva dog parents, nimma furry friend-ina aarogyakkaagi ${storeName}-ge banni. Illi sigutte ${productText} — complete and balanced nutrition. Pedigree jothe, nimma dog-ge ondu healthy and happy life kodi. We're for Dogs!`;\n\n      case 'malayalam':\n        return `Namaskaram ${full} chetta! ${area}-ile dog parents, ningalde furry friend-de aarogyathinu ${storeName}-il varoo. Ivide kittum ${productText} — complete and balanced nutrition. Pedigree-inoppam, ningalde dog-inu oru healthy and happy life nalkoo. We're for Dogs!`;\n\n      case 'telugu':\n        return `Namaskaram ${full} garu! ${area}-lo unna dog parents, mee furry friend aarogyam kosam ${storeName}-ki randi. Ikkada dorukutundi ${productText} — complete and balanced nutrition. Pedigree-tho, mee dog-ki oka healthy and happy life ivvandi. We're for Dogs!`;\n\n      default:\n        // Hinglish — north India default. Positive, professional, ~20 seconds.\n        return `Namaste ${full} ji! ${area} ke dog parents, apne furry friend ki sehat ke liye visit kijiye ${storeName}. Yahan milta hai ${productText} — sampurn aur santulit poshan. Pedigree ke saath dijiye apne dog ko ek healthy aur happy life. We're for Dogs!`;\n    }\n  }\n\n  async function startGeneration() {\n    document.getElementById('loader-err').classList.remove('show');\n    startLoadCopy();\n    startProgress();\n\n    const { firstName, lastName, storeName, area, productText } = state;\n    const inputText = buildScript({ firstName, lastName, storeName, area, productText });\n\n    // 1) Kick off video generation\n    const response = await fetch('https://api.heygen.com/v2/video/generate', {\n      method: 'POST',\n      headers: {\n        'X-Api-Key': HEYGEN_API_KEY,\n        'Content-Type': 'application/json',\n      },\n      body: JSON.stringify({\n        video_inputs: [{\n          character: {\n            type: 'avatar',\n            avatar_id: pickAvatar(),\n          },\n          voice: {\n            type: 'text',\n            input_text: inputText,\n            voice_id: VOICE_ID,\n          },\n        }],\n        dimension: { width: 720, height: 1280 },\n      }),\n    });\n\n    if (!response.ok) {\n      const txt = await response.text().catch(() => '');\n      throw new Error(`Generation request failed (${response.status}). ${txt.slice(0, 160)}`);\n    }\n    const data = await response.json();\n    const videoId = data && (data.data?.video_id || data.video_id);\n    if (!videoId) throw new Error('No video_id returned from HeyGen');\n\n    // 2) Poll status every 5s\n    const videoUrl = await pollStatus(videoId);\n    state.videoUrl = videoUrl;\n    stopLoadCopy();\n    stopProgress(true);\n    // brief beat so the user sees 100% before transition\n    await sleep(450);\n    showVideo(videoUrl);\n  }\n\n  async function pollStatus(videoId) {\n    while (true) {\n      await sleep(5000);\n      const statusResponse = await fetch(`https://api.heygen.com/v1/video_status.get?video_id=${videoId}`, {\n        headers: { 'X-Api-Key': HEYGEN_API_KEY },\n      });\n      if (!statusResponse.ok) {\n        const txt = await statusResponse.text().catch(() => '');\n        throw new Error(`Status check failed (${statusResponse.status}). ${txt.slice(0, 160)}`);\n      }\n      const sd = await statusResponse.json();\n      const payload = sd && (sd.data || sd);\n      const status  = payload && payload.status;\n\n      // If HeyGen sends a numeric progress, honor it. Otherwise nudge the bar\n      // based on status so it visibly responds to server state.\n      const reported = pickProgress(payload);\n      if (reported != null) {\n        // server-reported percent (cap at 95 so completion still 'pops' to 100)\n        setProgressTarget(Math.min(95, reported));\n      } else if (status === 'processing') {\n        setProgressTarget(Math.max(progressTarget, 35));\n      } else if (status === 'pending' || status === 'waiting') {\n        setProgressTarget(Math.max(progressTarget, 15));\n      }\n\n      if (status === 'completed') {\n        const url = payload.video_url || payload.video_url_caption || payload.url;\n        if (!url) throw new Error('Video completed but no URL was returned');\n        return url;\n      }\n      if (status === 'failed') {\n        const reason = (payload && (payload.error?.message || payload.error)) || 'unknown reason';\n        throw new Error('HeyGen rendering failed: ' + reason);\n      }\n      // else processing / pending — loop\n    }\n  }\n\n  // Try a handful of common field names HeyGen might use for progress.\n  function pickProgress(payload) {\n    if (!payload || typeof payload !== 'object') return null;\n    const candidates = ['progress', 'percent', 'percentage', 'completion', 'completed_percent'];\n    for (const k of candidates) {\n      const v = payload[k];\n      if (typeof v === 'number' && isFinite(v)) {\n        return v <= 1 ? v * 100 : v;   // accept 0..1 or 0..100\n      }\n    }\n    return null;\n  }\n\n  function sleep(ms) { return new Promise(res => setTimeout(res, ms)); }\n\n  function showVideo(url) {\n    const video = document.getElementById('result-video');\n    video.src = url;\n    video.classList.remove('ready');\n    video.addEventListener('loadeddata', () => video.classList.add('ready'), { once: true });\n    go('video');\n    // Try autoplay (muted) so user sees motion immediately\n    video.muted = false;\n    video.play().catch(() => {/* user will tap play */});\n  }\n\n  // ====== Download ======\n  document.getElementById('btn-download').addEventListener('click', async () => {\n    if (!state.videoUrl) return;\n    const btn = document.getElementById('btn-download');\n    const original = btn.innerHTML;\n    btn.disabled = true;\n    btn.innerHTML = 'Preparing…';\n    try {\n      const res = await fetch(state.videoUrl);\n      const blob = await res.blob();\n      const url = URL.createObjectURL(blob);\n      const a = document.createElement('a');\n      a.href = url;\n      a.download = `Pedigree-${(state.storeName || 'Store').replace(/\\s+/g, '-')}.mp4`;\n      document.body.appendChild(a);\n      a.click();\n      a.remove();\n      setTimeout(() => URL.revokeObjectURL(url), 5000);\n    } catch (e) {\n      // fallback: open in new tab\n      window.open(state.videoUrl, '_blank', 'noopener');\n    } finally {\n      btn.disabled = false;\n      btn.innerHTML = original;\n    }\n  });\n\n  // ====== Restart ======\n  document.getElementById('btn-restart').addEventListener('click', () => {\n    // reset state\n    state.firstName = state.lastName = state.storeName = state.area = '';\n    state.product = null; state.productLabel = ''; state.productText = ''; state.videoUrl = '';\n    firstNameEl.value = ''; lastNameEl.value = ''; storeEl.value = ''; areaEl.value = '';\n    productCards.forEach(c => c.classList.remove('selected'));\n    btnNameNext.disabled = btnStoreNext.disabled = btnAreaNext.disabled = btnProductsNext.disabled = true;\n    const video = document.getElementById('result-video');\n    video.pause(); video.removeAttribute('src'); video.load();\n    document.getElementById('loader-err').classList.remove('show');\n    go('welcome');\n  });\n\n  // loader-sub fade transition\n  document.getElementById('loader-sub').style.transition = 'opacity 220ms ease';\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
